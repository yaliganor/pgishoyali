<!DOCTYPE html>
<html lang="he">
<meta charset="UTF-8">
<head>
    <title>צור תמונה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            margin-top: 50px;
        }
        input {
            font-size: 18px;
            padding: 5px;
            margin: 5px;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        /* Hide the canvas, we will show the generated image instead */
        canvas {
            display: none; 
        }
        /* Style the output image so it looks like the canvas did */
        #outputImage {
            display: none;
            margin: 20px auto;
            border: 1px solid #ccc;
            max-width: 90%;
            height: auto;
        }
        .instruction {
            color: #555;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>מלא שם וכיתה:</h2>
    <input id="nameInput" placeholder="שם">
    <input id="classInput" placeholder="כיתה">
    <br>
    <button onclick="createImage()">צור תמונה רגילה</button>
    <button onclick="createValiV()">באלי וי</button>

    <canvas id="canvas"></canvas>
    
    <!-- This image replaces the canvas so mobile users can long-press to save -->
    <img id="outputImage" alt="התמונה שלך תופיע כאן">
    <p id="saveInstruction" class="instruction">לחיצה ארוכה על התמונה כדי לשמור בגלריה (או לחץ על הכפתור למטה)</p>
    
    <br>
    <a id="downloadLink" style="display:none;">הורד את התמונה (מחשב)</a>

    <script>
        const templateImg = new Image();
        templateImg.src = 'static/template.png';
        const valiVImg = new Image();
        valiVImg.src = 'static/V.png';

        // Function to display the canvas as an image for mobile saving
        function displayImageForMobile(filename) {
            const canvas = document.getElementById('canvas');
            const outputImage = document.getElementById('outputImage');
            const link = document.getElementById('downloadLink');
            const instruction = document.getElementById('saveInstruction');
            
            const dataURL = canvas.toDataURL("image/png");
            
            // Show the image element for long-pressing
            outputImage.src = dataURL;
            outputImage.style.display = "block";
            instruction.style.display = "block";

            // Keep the desktop download button working
            link.href = dataURL;
            link.download = filename;
            link.style.display = "inline-block";
        }

        function createImage() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { alert("אנא הכנס שם"); return; }

            templateImg.onload = () => drawTemplate(name);
            if (templateImg.complete) drawTemplate(name);
        }

        function drawTemplate(name) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = templateImg.width * 0.8;
            canvas.height = templateImg.height * 0.8;
            ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateStr = `${day}/${month}/${year}`;
            const timeStr = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

            ctx.fillStyle = "#6f7e89";
            ctx.textBaseline = "middle";

            ctx.font = `bold ${55 * 0.8}px Arial`;
            
            // Date & Time
            ctx.textAlign = "left";
            ctx.direction = "ltr"; 
            ctx.fillText(timeStr, canvas.width * 0.07, canvas.height * 0.385);
            ctx.fillText(dateStr, canvas.width * 0.65, canvas.height * 0.385);

            // Right-aligned Hebrew Text
            ctx.textAlign = "right";
            ctx.direction = "rtl";

            let maxWidth = canvas.width * 0.17;
            let fontSize = 55 * 0.8;
            ctx.font = `bold ${fontSize}px Arial`;

            while (ctx.measureText(name).width > maxWidth && fontSize > 10) {
                fontSize -= 1;
                ctx.font = `bold ${fontSize}px Arial`;
            }

            ctx.fillText(name, canvas.width * 0.90, canvas.height * 0.445);

            displayImageForMobile("output.png");
        }

function drawValiV(name, userClass) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = valiVImg.width;
            canvas.height = valiVImg.height;
            ctx.drawImage(valiVImg, 0, 0);

            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2);
            const dateStr = `${day}/${month}/${year}`;

            const startHour = now.getHours();
            const endHour = startHour + 2;
            const hourStr = `${startHour}:00-${endHour}:00`;

            ctx.font = "25px Arial";
            ctx.fillStyle = "black";
            
            // Setting Right-to-Left formatting
            ctx.textAlign = "right";
            ctx.direction = "rtl";

            // ADJUSTED X COORDINATES:
            // The first number (X) is the RIGHT edge of the text.
            // Decrease X to move the text further LEFT.
            // Increase X to move the text further RIGHT.
            
            // Top Row (Date and Hour Range)
            ctx.fillText(`${dateStr}`, 320, 217);  
            ctx.fillText(`${hourStr}`, 280, 217);  
            
            // Middle Row (Name and Class)
            ctx.fillText(`${name}`, 320, 273);     
            ctx.fillText(`${userClass}`, 90, 273); 
            
            // Bottom Row (Start and End Hours)
            ctx.fillText(`${startHour}:00`, 310, 448); 
            ctx.fillText(`${endHour}:00`, 90, 448);   

            displayImageForMobile("V_filled.png");
        }
    </script>
</body>
</html>
