<!DOCTYPE html>
<html lang="he">
<meta charset="UTF-8">
<head>
    <title>צור תמונה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            margin-top: 50px;
        }

        input {
            font-size: 18px;
            padding: 5px;
            margin: 5px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }

        /* עיצוב להודעת השיפוצים */
        #message {
            font-size: 45px;
            font-weight: bold;
            color: #d9534f; /* צבע אדום כדי שיבלוט */
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h2>מלא שם וכיתה:</h2>
    <input id="nameInput" placeholder="שם">
    <input id="classInput" placeholder="כיתה">
    <br>
    <button onclick="showMaintenanceMessage()">צור תמונה רגילה</button>
    <button onclick="showMaintenanceMessage()">באלי וי</button>

    <!-- כאן תופיע ההודעה -->
    <div id="message"></div>

    <script>
        function showMaintenanceMessage() {
            // הזרקת הטקסט לתוך ה-div הרלוונטי
            document.getElementById('message').innerText = "האתר בשיפוצים אעדכן בקרוב אלופים";
        }
    </script>
</body>
</html>
